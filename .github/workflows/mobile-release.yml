name: mobile-release

# 모바일 앱 빌드. 데스크톱(build.yml)과 같은 원칙이다 — **태그가 릴리즈를 만든다.**
# 누구의 노트북에서 무엇을 구웠는지가 아니라, 레포의 어느 커밋에서 나왔는지가 남아야 한다.
#
# 빌드는 **GitHub 러너에서 직접 굽는다**(`eas build --local`). EAS 클라우드 빌드는 무료 플랜이
# 월 15회(플랫폼별)뿐이라, 스토어 준비처럼 검증 빌드를 여러 번 굽는 시기에 금방 바닥난다.
# 실제로 v1.0.0 을 준비하다 할당량이 떨어져 확인용 빌드조차 못 굽는 상황이 있었다.
#
# 프레임워크는 그대로 Expo 다. 바뀐 것은 **어느 기계가 Gradle/Xcode 를 돌리느냐**뿐이고,
# EAS 의 나머지 기능은 계속 쓴다:
#   - 자격증명 — `--local` 에서도 키스토어를 EAS 서버에서 받아 온다(EXPO_TOKEN 만 있으면 된다).
#     그래서 레포에도 시크릿에도 키스토어를 두지 않는다.
#   - versionCode / buildNumber — `appVersionSource: remote` 그대로. 되감기면 안 되는 단조
#     증가 값이라 커밋으로 관리하면 충돌이 난다.
#   - 제출 — `eas submit`.
#
# 사람이 보는 버전(app.json 의 version)은 **레포**가 갖고, 태그가 그것과 일치하는지 검사한다.
run-name: 'mobile: ${{ github.ref_name }}'

on:
  push:
    tags: ['mobile-v*']
  # 스토어에 내지 않고 preview/development 를 구울 때 쓴다.
  workflow_dispatch:
    inputs:
      profile:
        description: '빌드 프로파일'
        type: choice
        default: preview
        options: [development, preview, production]
      platform:
        description: '플랫폼'
        type: choice
        default: android
        options: [android, ios, all]

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROFILE: ${{ inputs.profile || 'production' }}

jobs:
  # 굽기 전에 잡는다. 로컬 빌드는 클라우드보다 오래 걸리고(러너가 Gradle 을 처음부터 받는다),
  # 깨진 번들은 빌드가 성공해도 폰에서 죽는다.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      # 태그와 app.json 의 version 이 어긋나면, 스토어에는 옛 버전이 올라가는데 릴리즈 이름만
      # 새 버전이 된다. 빌드는 성공으로 끝나므로 눈치채기 어렵다 — 굽기 전에 끊는다.
      - name: Preflight — 태그와 app.json version 일치
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        run: |
          set -euo pipefail
          app="$(node -p "require('./app.json').expo.version")"
          tag="${GITHUB_REF_NAME#mobile-v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::태그($GITHUB_REF_NAME → $tag)와 app.json version($app)이 다릅니다."
            echo "apps/mobile/app.json 의 expo.version 을 bump 한 커밋에 태그를 다세요."
            exit 1
          fi
          echo "태그/버전 일치 확인됨: $app"

      # 자격증명과 versionCode 를 EAS 에서 받아 오므로, 로컬 빌드라도 토큰은 필요하다.
      - name: Preflight — EXPO_TOKEN 있음
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN 시크릿이 없습니다."
            echo "expo.dev/settings/access-tokens 에서 만들어 Settings → Secrets → Actions 에 등록하세요."
            exit 1
          fi
          echo "EXPO_TOKEN 확인됨."

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test

  android:
    needs: check
    if: >-
      github.event_name == 'push' ||
      inputs.platform == 'android' ||
      inputs.platform == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      # Android Gradle Plugin 8.x 가 요구하는 최소 JDK. 러너 기본값에 맡기지 않는다 —
      # 이미지가 바뀌면 조용히 다른 JDK 로 굽게 된다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # `eas build --local` 은 EAS 의 캐시를 쓰지 못한다("Local builds do not support
      # restoring cache"). 그대로 두면 매번 Gradle 배포판과 의존성을 처음부터 받는다.
      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      - name: Build (local)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
        run: |
          set -euo pipefail
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          npx eas build --profile "$PROFILE" --platform android --local --non-interactive

      - name: 산출물 확인
        id: artifact
        run: |
          set -euo pipefail
          dir="${{ runner.temp }}/artifacts"
          file="$(find "$dir" -maxdepth 1 -type f \( -name '*.aab' -o -name '*.apk' \) | head -1)"
          if [ -z "$file" ]; then
            echo "::error::산출물이 없습니다. 빌드 로그를 확인하세요."
            ls -la "$dir" || true
            exit 1
          fi
          echo "path=$file" >> "$GITHUB_OUTPUT"
          version="$(node -p "require('./app.json').expo.version")"
          {
            echo "## Android · $PROFILE"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 버전 | $version |"
            echo "| 파일 | \`$(basename "$file")\` ($(du -h "$file" | cut -f1)) |"
            echo
            case "$file" in
              *.aab) echo 'AAB 입니다 — 폰에 직접 깔 수 없고 Play 업로드용입니다.' ;;
              *) echo '아래 artifacts 에서 내려받아 폰에 설치할 수 있습니다.' ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wooi-android-${{ github.ref_name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # 스토어 제출. **기본은 꺼져 있다** — Play 는 신규 앱의 첫 AAB 를 API 로 받지 않는다.
      # 콘솔에서 한 번 손으로 올려 패키지 이름을 등록해야 그다음부터 API 가 열린다. 준비되기
      # 전에 이 단계가 돌면 태그를 밀 때마다 릴리즈가 빨갛게 실패하므로 변수로 잠가 둔다:
      #
      #   Settings → Secrets and variables → Actions → Variables
      #   MOBILE_AUTO_SUBMIT = true
      #
      # 켜기 전에: ① 콘솔에 AAB 수동 업로드 ② 서비스 계정에 "출시 관리자" 권한
      # ③ `eas credentials --platform android` 로 키를 EAS 에 올린다(레포에 키 파일을 두지 않는다).
      #
      # `--latest` 가 아니라 `--path` 를 쓴다 — 로컬 빌드는 EAS 에 빌드 레코드를 남기지 않으므로
      # "가장 최근 빌드" 라는 말이 성립하지 않는다.
      - name: Submit — Play 제출
        if: startsWith(github.ref, 'refs/tags/mobile-v') && vars.MOBILE_AUTO_SUBMIT == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas submit --profile production --platform android --path "${{ steps.artifact.outputs.path }}" --non-interactive

  ios:
    needs: check
    if: >-
      github.event_name == 'push' ||
      inputs.platform == 'ios' ||
      inputs.platform == 'all'
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: CocoaPods 캐시
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}
          restore-keys: pods-${{ runner.os }}-

      - run: npm ci

      - name: Build (local)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
        run: |
          set -euo pipefail
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR"
          npx eas build --profile "$PROFILE" --platform ios --local --non-interactive

      - name: 산출물 확인
        id: artifact
        run: |
          set -euo pipefail
          dir="${{ runner.temp }}/artifacts"
          file="$(find "$dir" -maxdepth 1 -type f \( -name '*.ipa' -o -name '*.tar.gz' \) | head -1)"
          if [ -z "$file" ]; then
            echo "::error::산출물이 없습니다. 빌드 로그를 확인하세요."
            ls -la "$dir" || true
            exit 1
          fi
          echo "path=$file" >> "$GITHUB_OUTPUT"
          version="$(node -p "require('./app.json').expo.version")"
          {
            echo "## iOS · $PROFILE"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 버전 | $version |"
            echo "| 파일 | \`$(basename "$file")\` ($(du -h "$file" | cut -f1)) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wooi-ios-${{ github.ref_name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # 수출 규정 답은 App Store Connect 에 적는다 — Info.plist 가 아니라. 이유는
      # apps/mobile/README.md 의 "수출 규정" 절.
      - name: Submit — App Store 제출
        if: startsWith(github.ref, 'refs/tags/mobile-v') && vars.MOBILE_AUTO_SUBMIT == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas submit --profile production --platform ios --path "${{ steps.artifact.outputs.path }}" --non-interactive
