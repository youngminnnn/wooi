name: ci

# PR 와 main push 마다 도는 검증 게이트.
# 저렴한 ubuntu 러너에서만 실행하고, 비싼 macOS 빌드는 build.yml 로 분리한다.
on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치/PR 에 새 커밋이 오면 진행 중이던 실행을 취소해 러너를 아낀다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR 브랜치 이름이 Conventional Commits prefix 규칙(feat/…, fix/… 등)을 지키는지 검증한다.
  # 로컬 husky pre-push 훅과 동일한 스크립트를 공유하며, 우회 불가한 최종 게이트다.
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/check-branch-name.mjs "$HEAD_REF"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # Electron 바이너리는 GitHub Releases 에서 별도로 내려받는다. 일시적인 CDN/네트워크 오류가
      # 나면 npm 패키지 설치 전체가 실패하므로 깨끗한 설치를 몇 번 재시도한다. postinstall 이
      # 다운로드 실패를 정확히 반환해야 테스트에서 뒤늦게 연쇄 실패하지 않는다.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm ci failed (attempt $attempt/3); retrying in 5 seconds..."
            sleep 5
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # 테스트보다 먼저 빌드한다. 일부 e2e 는 빌드 산출물을 대상으로 돌고(codex 가 spawn 하는
      # toolShim 은 소스가 아니라 out/main 의 그 파일이다), 산출물이 없으면 조용히 건너뛴다 —
      # 그러면 패키징에서만 드러나는 회귀를 잡으라고 넣은 검사가 CI 에서 한 번도 돌지 않는다.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # 모바일은 자체 lockfile 을 가진 독립 프로젝트라 위 verify 잡이 건드리지 않는다.
  # `npm ci` 로 도는 것이 중요하다 — 이 프로젝트를 --legacy-peer-deps 로 설치해 lockfile 이
  # package.json 과 어긋난 적이 있고, 관대한 `npm install` 로는 드러나지 않다가 EAS 클라우드
  # 빌드에서만 터졌다. 여기서 같은 명령으로 돌려 그 회귀를 PR 단계에서 잡는다.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # 고위험 이상 취약점을 노출한다. 새 advisory 는 수시로 공개되므로 무관한 PR 까지
      # 막지 않도록 non-blocking(continue-on-error) 으로 두고, 실제 수정은 Dependabot PR 로
      # 처리한다. 정기 정리를 강제하려면 continue-on-error 를 제거해 blocking 으로 바꾸면 된다.
      - name: npm audit (high+, informational)
        continue-on-error: true
        run: npm audit --audit-level=high
