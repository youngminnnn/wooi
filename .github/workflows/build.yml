name: build

# run 목록에 커밋 메시지 대신 "release: <태그>" 로 표시한다(태그 빌드 기준).
# workflow_dispatch 등 태그가 아닌 경우엔 ref 이름이 그대로 들어간다.
run-name: 'release: ${{ github.ref_name }}'

# private repo 의 macOS 러너는 분당 과금이 크므로(무료 분량 10배 소진),
# 일반 push 마다 돌지 않게 수동 실행과 버전 태그 push 에서만 빌드한다.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon (arm64)
    permissions:
      contents: write # 태그 빌드 시 GitHub Release 생성/업로드에 필요
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build signed + notarized dmg + zip
        # Developer ID Application 인증서로 서명하고 Apple 에 공증한다.
        # - CSC_LINK: base64 로 인코딩한 .p12 (Developer ID Application) 인증서
        # - CSC_KEY_PASSWORD: .p12 export 시 지정한 비밀번호
        # - APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID: 공증 자격증명
        # electron-builder 가 CSC_LINK 를 임시 keychain 으로 가져와 서명하고,
        # package.json build.mac.notarize 설정에 따라 공증을 수행한다.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist

      - uses: actions/upload-artifact@v7
        with:
          name: wooi-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      # v* 태그로 트리거된 경우에만 GitHub Release 를 만들고 산출물을 첨부한다.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.dmg release/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
