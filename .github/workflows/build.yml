name: build

# run 목록에 커밋 메시지 대신 "release: <태그>" 로 표시한다(태그 빌드 기준).
# workflow_dispatch 등 태그가 아닌 경우엔 ref 이름이 그대로 들어간다.
run-name: 'release: ${{ github.ref_name }}'

# 공증(notarize)이 Apple 서버 왕복으로 수 분씩 걸리므로, 일반 push 마다 돌지 않게
# 수동 실행과 버전 태그 push 에서만 빌드한다. 코드 검증은 ci.yml 이 담당한다.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon (arm64)
    permissions:
      contents: write # 태그 빌드 시 GitHub Release 생성/업로드에 필요
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      # electron-builder 는 태그가 아니라 package.json 의 version 으로 빌드한다. 둘이
      # 어긋나면 릴리스 제목만 새 버전이고 실제 바이너리·latest-mac.yml 은 옛 버전이
      # 되어, 기존 사용자에게 자동 업데이트가 **영원히 도달하지 않는다**. 게다가 빌드는
      # 성공으로 끝나 눈치채기 어렵다. 공증에 수 분 쓰기 전에 여기서 끊는다.
      # 버전 정책: docs/releasing.md
      - name: Preflight — tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::태그($GITHUB_REF_NAME → $tag)와 package.json version($pkg)이 다릅니다."
            echo "release: v$tag 커밋에서 package.json 을 bump 했는지, 태그를 그 커밋에 달았는지 확인하세요."
            exit 1
          fi
          echo "태그/버전 일치 확인됨: $pkg"

      - run: npm ci

      # electron-builder 는 서명 자격증명이 없으면 "skipped macOS application code
      # signing" 경고만 남기고 **성공 종료**한다. 그대로 두면 인증서 만료·시크릿 삭제 시
      # 서명도 공증도 안 된 앱이 조용히 릴리스로 나간다. 빌드 전에 먼저 끊는다.
      - name: Preflight — signing secrets present
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::서명/공증 시크릿 누락: ${missing[*]}"
            echo "Settings → Secrets and variables → Actions 에서 등록하세요."
            exit 1
          fi
          echo "서명/공증 시크릿 5종 확인됨."

      - name: Build signed + notarized dmg + zip
        # Developer ID Application 인증서로 서명하고 Apple 에 공증한다.
        # - CSC_LINK: base64 로 인코딩한 .p12 (Developer ID Application) 인증서
        # - CSC_KEY_PASSWORD: .p12 export 시 지정한 비밀번호
        # - APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID: 공증 자격증명
        # electron-builder 가 CSC_LINK 를 임시 keychain 으로 가져와 서명하고,
        # package.json build.mac.notarize 설정에 따라 공증을 수행한다.
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist

      # electron-builder 로그만 믿지 않고 시스템 도구로 재검증한다. 서명 주체·hardened
      # runtime·공증 티켓·Gatekeeper 평가 중 하나라도 어긋나면 릴리스 전에 실패시킨다.
      - name: Verify signature + notarization
        run: |
          set -euo pipefail
          APP="$(ls -d release/mac-arm64/*.app 2>/dev/null | head -1 || true)"
          [ -n "$APP" ] || { echo "::error::앱 번들을 찾을 수 없습니다 (release/mac-arm64/*.app)"; exit 1; }
          echo "검증 대상: $APP"

          echo "--- codesign --verify"
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "--- 서명 주체 + hardened runtime"
          info="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          grep -q "Authority=Developer ID Application" <<<"$info" \
            || { echo "::error::Developer ID Application 으로 서명되지 않았습니다."; echo "$info"; exit 1; }
          grep -Eq "flags=.*runtime" <<<"$info" \
            || { echo "::error::hardened runtime 이 적용되지 않았습니다."; echo "$info"; exit 1; }

          echo "--- 공증 티켓(stapling)"
          xcrun stapler validate "$APP"

          echo "--- Gatekeeper 평가"
          spctl -a -vvv -t exec "$APP"

      # 랜딩 페이지(docs/index.html)와 README 가
      # /releases/latest/download/Wooi-arm64.dmg 로 직접 링크한다. 이 URL 은 에셋
      # 이름이 정확히 일치할 때만 동작하므로, dmg 파일명이 바뀌면 링크가 조용히
      # 404 가 된다. package.json build.dmg.artifactName 회귀를 여기서 잡는다.
      - name: Verify stable dmg filename
        run: |
          if [ ! -f release/Wooi-arm64.dmg ]; then
            echo "::error::release/Wooi-arm64.dmg 가 없습니다. package.json 의 build.dmg.artifactName 을 확인하세요."
            ls -1 release
            exit 1
          fi
          echo "고정 dmg 파일명 확인됨: Wooi-arm64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: wooi-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

      # v* 태그로 트리거된 경우에만 GitHub Release 를 만들고 산출물을 첨부한다.
      # latest-mac.yml + *-mac.zip + .blockmap 은 electron-updater 자동 업데이트에 필요하다.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml)

          # 빌드 재실행 시 릴리스가 이미 존재하면 create 가 실패하므로, 그 경우엔
          # 산출물만 덮어쓴다(--clobber). 자동 업데이트가 참조하는 latest-mac.yml 이
          # 옛 빌드에 고정되는 것을 막는다.
          #
          # 주의: 이 경로는 "릴리스는 만들어졌는데 공증 실패 등으로 산출물이 없거나
          # 깨진" 복구 상황 전용이다. 이미 사용자에게 배포된 버전의 바이너리를 갈아끼우면
          # 같은 버전 번호로 서로 다른 바이너리가 돌아다니게 된다. 잘못 나간 릴리스는
          # 덮어쓰지 말고 다음 PATCH 를 올려라 — docs/releasing.md "버전 번호 불변" 참고.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::warning::릴리스 $GITHUB_REF_NAME 가 이미 있어 산출물을 덮어씁니다. 이미 배포된 버전이라면 중단하고 다음 PATCH 로 다시 내세요(docs/releasing.md)."
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  # `brew install --cask youngminnnn/tap/wooi` 가 가리키는 tap 저장소
  # (youngminnnn/homebrew-tap) 의 Casks/wooi.rb 를 새 릴리스로 갱신한다.
  # 손으로 하면 sha256 을 잘못 붙여도 사용자가 설치를 시도할 때까지 아무도 모른다.
  #
  # 릴리스가 실제로 만들어진 뒤에만 의미가 있으므로 macos 잡 성공 + 태그 빌드에만 돈다.
  # 서명이 필요 없어 ubuntu 에서 돈다(macos 러너는 분당 과금이 10배).
  homebrew-tap:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read # tap 저장소는 이 리포 토큰이 아니라 TAP_TOKEN 으로 push 한다
    steps:
      # 시크릿이 없으면 아래 checkout 이 "repository not found" 라는 엉뚱한 메시지로
      # 죽는다. 조용히 스킵(`if: secrets.TAP_TOKEN != ''`)하면 릴리스는 초록불인데
      # brew 만 옛 버전에 멈춰 더 나쁘다 — 위 preflight 들과 같이 여기서 끊는다.
      - name: Preflight — tap token present
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::error::TAP_TOKEN 시크릿이 없습니다."
            echo "youngminnnn/homebrew-tap 에 contents:write 권한이 있는 PAT 를 Settings → Secrets and variables → Actions 에 TAP_TOKEN 으로 등록하세요."
            exit 1
          fi
          echo "TAP_TOKEN 확인됨."

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: youngminnnn/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      # 아티팩트가 아니라 릴리스에 붙은 URL 그대로 받는다. cask 가 쓸 바로 그 URL 이
      # 실제로 살아 있는지까지 같이 검증된다.
      - name: Compute dmg sha256
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Wooi-arm64.dmg"
          echo "받는 중: $url"
          curl -fsSL --retry 3 --retry-delay 5 -o Wooi-arm64.dmg "$url"
          sha="$(sha256sum Wooi-arm64.dmg | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_ENV"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "sha256: $sha"

      # build/homebrew/wooi.rb 가 원본이고, 여기서는 version/sha256 두 줄만 갈아끼운다.
      # 나머지(url·zap·auto_updates)를 CI 에서 만들어 내면 리뷰 대상이 워크플로 안의
      # heredoc 이 되어 버린다.
      - name: Render cask
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          sed -E \
            -e "s|^  version \".*\"$|  version \"${version}\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"${sha256}\"|" \
            build/homebrew/wooi.rb > tap/Casks/wooi.rb

          # sed 는 패턴이 안 맞아도 조용히 원본을 그대로 흘려보낸다. 그러면 옛 버전·옛
          # 해시가 그대로 tap 에 커밋되고, 설치하는 사람이 sha256 mismatch 로 처음 안다.
          grep -qF "  version \"${version}\"" tap/Casks/wooi.rb \
            || { echo "::error::cask 의 version 치환 실패 — build/homebrew/wooi.rb 의 version 줄 형식을 확인하세요."; exit 1; }
          grep -qF "  sha256 \"${sha256}\"" tap/Casks/wooi.rb \
            || { echo "::error::cask 의 sha256 치환 실패 — build/homebrew/wooi.rb 의 sha256 줄 형식을 확인하세요."; exit 1; }
          echo "--- tap/Casks/wooi.rb"
          cat tap/Casks/wooi.rb

      - name: Commit + push to tap
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/wooi.rb
          if git diff --cached --quiet; then
            echo "tap 이 이미 ${version} 입니다 — 커밋할 변경 없음."
            exit 0
          fi
          git commit -m "wooi ${version}"
          git push
          echo "tap 갱신됨: brew install --cask youngminnnn/tap/wooi (${version})"
