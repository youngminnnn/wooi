name: approve-owner-pr

# 1인 메인테이너가 자기 PR 을 직접 승인할 수 없는 GitHub 제약을 보완한다.
# 별도 machine user 를 Code Owner 로 두고, 저장소 소유자가 이 저장소 안에서 만든
# main 대상 PR 만 승인한다. 외부 기여자의 PR 은 계속 @youngminnnn 승인이 필요하다.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

# pull_request_target 은 기본 브랜치의 워크플로를 실행하므로 쓰기 자격증명을 쓸 수 있다.
# 그 대신 PR 브랜치의 코드는 절대 checkout 하거나 실행하지 않는다.
permissions:
  contents: read

jobs:
  approve:
    if: >-
      github.event.pull_request.user.login == 'youngminnnn' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Approve the repository owner's PR
        env:
          GH_TOKEN: ${{ secrets.CODEOWNER_BOT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f event=APPROVE \
            -f commit_id="${PR_HEAD_SHA}" \
            -f body='Automatically approved by the repository owner review bot.'
