name: Bug report
description: Report a problem with Wooi
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill out the sections
        below so it can be reproduced.

        ⚠️ **Do not report security vulnerabilities here** — see
        [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the problem.
      placeholder: |
        1. Create a workspace on repo …
        2. Send message …
        3. See error …
    validations:
      required: true
  - type: input
    id: wooi-version
    attributes:
      label: Wooi version
      description: Shown in the app / release you downloaded (e.g. v0.6.0).
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 15.5 (Apple Silicon)
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: CLI versions (optional)
      description: Output of `git --version`, `gh --version`, and your Claude Code version if relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots (optional)
      description: Paste any relevant error output or screenshots. Redact anything sensitive.
    validations:
      required: false
