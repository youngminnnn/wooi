<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e15"/>
      <stop offset="1" stop-color="#141a28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#3a4a8f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3a4a8f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#6d8bfa"/>
      <stop offset="1" stop-color="#c6a6f3"/>
    </linearGradient>
    <!-- 앱 아이콘과 동일한 `우`(파랑)/`이`(보라) 그라데이션. 직선 획이 사라지지 않도록 반드시
         userSpaceOnUse 를 쓴다 — objectBoundingBox 는 폭·높이가 0 인 도형을 렌더링하지 않는다. -->
    <linearGradient id="u" gradientUnits="userSpaceOnUse" x1="180" y1="240" x2="540" y2="780">
      <stop offset="0" stop-color="#8fc0ff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <linearGradient id="i" gradientUnits="userSpaceOnUse" x1="500" y1="240" x2="870" y2="800">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#c9adff"/>
    </linearGradient>
    <font-face font-family="ui"><font-face-src/></font-face>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- 한글 "우이" 마크 (오른쪽). build/icon.svg 와 같은 1024 좌표계를 그대로 쓰고 배치만 스케일한다. -->
  <g transform="translate(763.9,91) scale(0.4318)" fill="none" stroke-width="58" stroke-linecap="round">
    <!-- 우 -->
    <circle cx="322" cy="366" r="102" stroke="url(#u)"/>
    <path d="M182 584 H 462" stroke="url(#u)"/>
    <path d="M322 584 V 754" stroke="url(#u)"/>
    <!-- 이 -->
    <circle cx="650" cy="562" r="102" stroke="url(#i)"/>
    <path d="M842 350 V 774" stroke="url(#i)"/>
  </g>

  <!-- eyebrow -->
  <g font-family="'Helvetica Neue',Arial,sans-serif">
    <circle cx="96" cy="99" r="7" fill="#5b8cf6"/>
    <text x="118" y="108" font-size="27" font-weight="700" letter-spacing="3"
          fill="#8b93a4">macOS · CLAUDE CODE + CODEX</text>

    <!-- title -->
    <text x="84" y="238" font-size="132" font-weight="800" letter-spacing="-2"
          fill="url(#title)">Wooi</text>

    <!-- headline -->
    <text x="88" y="350" font-size="54" font-weight="800" fill="#f4f6fb">Parallel agents are easy.</text>
    <text x="88" y="416" font-size="54" font-weight="800" fill="#f4f6fb"><tspan fill="#9d8bf5">Landing their work</tspan> isn't.</text>

    <!-- subtitle -->
    <text x="90" y="506" font-size="28" font-weight="400" fill="#8a93a3">Dependent work stacks instead of conflicting.</text>
    <text x="90" y="546" font-size="28" font-weight="400" fill="#8a93a3">Every PR review lands on the diff.</text>
  </g>
</svg>
