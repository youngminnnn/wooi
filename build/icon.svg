<!--
  Wooi 앱 아이콘. 이름의 유래인 한글 "우이"를 그대로 워드마크로 쓴다.
  `우`(ㅇ+ㅜ)와 `이`(ㅇ+ㅣ)가 각각 ㅇ 으로 시작하므로 동그라미가 두 개 나오는데,
  이는 로마자 표기 "wooi" 의 `oo` 이자 병렬로 도는 두 세션을 함께 가리킨다.
  파랑(`우`)→보라(`이`) 그라데이션은 앱의 강조색(brand=sky, accent=violet)과 맞춘다.

  주의: 그라데이션은 반드시 gradientUnits="userSpaceOnUse" 여야 한다. 기본값인
  objectBoundingBox 는 바운딩 박스의 폭이나 높이가 0 이면 요소를 렌더링하지 않는데,
  ㅜ 의 가로획과 ㅣ 의 세로획이 정확히 그 경우라 획이 통째로 사라진다.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 배경: 위쪽이 살짝 밝은 차콜 → 아래쪽 거의 검정 -->
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#20242e" />
      <stop offset="0.55" stop-color="#13161c" />
      <stop offset="1" stop-color="#0a0b0d" />
    </linearGradient>
    <!-- `우` — 파랑 -->
    <linearGradient id="u" gradientUnits="userSpaceOnUse" x1="180" y1="240" x2="540" y2="780">
      <stop offset="0" stop-color="#8fc0ff" />
      <stop offset="1" stop-color="#5b8cff" />
    </linearGradient>
    <!-- `이` — 보라 -->
    <linearGradient id="i" gradientUnits="userSpaceOnUse" x1="500" y1="240" x2="870" y2="800">
      <stop offset="0" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#c9adff" />
    </linearGradient>
    <!-- 글자 뒤 부드러운 광원 -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c9bff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#7c9bff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- macOS squircle 근사 배경 -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)" />
  <!-- 상단 가장자리 미세 하이라이트로 입체감 -->
  <rect x="2" y="2" width="1020" height="1020" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />
  <rect x="140" y="140" width="744" height="744" rx="260" fill="url(#glow)" />

  <!-- 우 -->
  <circle cx="322" cy="366" r="102" fill="none" stroke="url(#u)" stroke-width="58" />
  <path d="M182 584 H 462" fill="none" stroke="url(#u)" stroke-width="58" stroke-linecap="round" />
  <path d="M322 584 V 754" fill="none" stroke="url(#u)" stroke-width="58" stroke-linecap="round" />

  <!-- 이 -->
  <circle cx="650" cy="562" r="102" fill="none" stroke="url(#i)" stroke-width="58" />
  <path d="M842 350 V 774" fill="none" stroke="url(#i)" stroke-width="58" stroke-linecap="round" />
</svg>
